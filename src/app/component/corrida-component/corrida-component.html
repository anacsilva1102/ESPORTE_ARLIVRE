<div id="corrida">

    <h1>Cadastro de Corrida</h1>

    <form id="form-corrida" (submit)="cadastrarCorrida()">

        <label for="descricao">
            Descrição da Corrida
        </label>

        <input
            type="text"
            id="descricao"
            name="descricao"
            [(ngModel)]="corrida.descricao"
            placeholder="Digite a descrição da corrida"
            required
        >

        <label for="data">
            Data da Corrida
        </label>

        <input
            type="date"
            id="data"
            name="data"
            [(ngModel)]="corrida.data"
            required
        >

        <label>
            Distâncias Disponíveis
        </label>

        <div class="distancias">

            <label>
                <input
                    type="checkbox"
                    name="km5"
                    [(ngModel)]="corrida.km5"
                >
                5 km
            </label>

            <label>
                <input
                    type="checkbox"
                    name="km10"
                    [(ngModel)]="corrida.km10"
                >
                10 km
            </label>

            <label>
                <input
                    type="checkbox"
                    name="km25"
                    [(ngModel)]="corrida.km25"
                >
                25 km
            </label>

        </div>

        <div id="div-btns">

            <button
                type="submit"
                id="btnAdd">
                Cadastrar Corrida
            </button>

            <button
                type="button"
                id="btnLimpar"
                (click)="limparFormulario()">
                Limpar
            </button>

        </div>

    </form>

</div>
