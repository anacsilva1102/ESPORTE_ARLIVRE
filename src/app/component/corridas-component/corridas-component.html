<div id="corridas">

    <h1>Corridas Disponíveis</h1>

    <div
        class="corrida"
        *ngFor="let corrida of corridas"
    >

        <h2>
            {{ corrida.descricao }}
        </h2>

        <p>
            Data: {{ corrida.data }}
        </p>

        <p>
            Distâncias: {{ corrida.distancias }}
        </p>

        <button
            type="button"
            (click)="inscrever(corrida)"
        >
            Inscrever-se
        </button>

    </div>

</div>
