<div id="div-form">

    <h2>Cadastro Corrida</h2>

    <form id="form-atleta" (submit)="dadosFormulario()">

        <label for="corrida">Descrição da Corrida</label>

        <textarea
            name="corrida"
            [(ngModel)]="descricao_corrida"
            id="corrida"
            class="elem-form01"
            placeholder="Descreva a corrida"
            maxlength="300">
        </textarea>

        <label for="data_corrida">Data Corrida</label>

        <input
            type="date"
            name="data_corrida"
            [(ngModel)]="data_corrida"
            id="data_corrida"
            class="input02"
            required>

        <label>Distâncias Disponíveis</label>

        <div id="div-checkbox">

            <input
                type="checkbox"
                name="distancia5km"
                [(ngModel)]="distancia5km"
                id="distancia5km"
                class="btnSelecao"
                value="5km">
            <label for="distancia5km">5Km</label>

            <input
                type="checkbox"
                name="distancia10km"
                [(ngModel)]="distancia10km"
                id="distancia10km"
                class="btnSelecao"
                value="10km">
            <label for="distancia10km">10Km</label>

            <input
                type="checkbox"
                name="distancia25km"
                [(ngModel)]="distancia25km"
                id="distancia25km"
                class="btnSelecao"
                value="25km">
            <label for="distancia25km">25Km</label>

        </div>

        <div id="div-btns">

            <button
                type="submit"
                id="btnAdd">
                Cadastrar Corrida
            </button>

            <button
                type="button"
                id="btnLimpar"
                (click)="limparAtributos()">
                Limpar
            </button>

        </div>

    </form>

</div>
