<div id="atleta">

    <h1>Cadastro de Atleta</h1>

    <form id="form-atleta" (submit)="cadastrarAtleta()">

        <label for="nome">
            Nome Completo
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            [(ngModel)]="atleta.nome"
            required
        >

        <div class="linha">

            <div class="campo">

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    [(ngModel)]="atleta.cpf"
                    required
                >

            </div>

            <div class="campo">

                <label>
                    Sexo
                </label>

                <div class="sexo-opcoes">

                    <label>
                        <input
                            type="radio"
                            name="sexo"
                            value="Masculino"
                            [(ngModel)]="atleta.sexo"
                        >

                        Masculino
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="sexo"
                            value="Feminino"
                            [(ngModel)]="atleta.sexo"
                        >

                        Feminino
                    </label>

                </div>

            </div>

        </div>

        <div class="linha">

            <div class="campo">

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    [(ngModel)]="atleta.cep"
                    required
                >

            </div>

            <div class="campo">

                <label for="rua">
                    Rua / Logradouro
                </label>

                <input
                    type="text"
                    id="rua"
                    name="rua"
                    placeholder="Rua, avenida, etc."
                    [(ngModel)]="atleta.rua"
                    required
                >

            </div>

        </div>

        <div class="linha">

            <div class="campo">

                <label for="bairro">
                    Bairro
                </label>

                <input
                    type="text"
                    id="bairro"
                    name="bairro"
                    placeholder="Digite o bairro"
                    [(ngModel)]="atleta.bairro"
                    required
                >

            </div>

            <div class="campo">

                <label for="uf">
                    Estado
                </label>

                <select
                    id="uf"
                    name="uf"
                    [(ngModel)]="atleta.uf"
                    (change)="carregarMunicipios()"
                    required
                >

                    <option value="">
                        Selecione o estado
                    </option>

                    <option
                        *ngFor="let estado of estados"
                        [value]="estado.uf"
                    >

                        {{ estado.nome }} - {{ estado.uf }}

                    </option>

                </select>

            </div>

        </div>

        <div class="linha">

            <div class="campo">

                <label for="municipio">
                    Município
                </label>

                <select
                    id="municipio"
                    name="municipio"
                    [(ngModel)]="atleta.municipio"
                    [disabled]="!atleta.uf || carregandoMunicipios"
                    required
                >

                    <option value="">

                        {{
                            carregandoMunicipios
                            ? 'Carregando municípios...'
                            : 'Selecione o município'
                        }}

                    </option>

                    <option
                        *ngFor="let municipio of municipios"
                        [value]="municipio.nome"
                    >

                        {{ municipio.nome }}

                    </option>

                </select>

            </div>

        </div>

        <div id="div-btns">

            <button
                type="submit"
                id="btnAdd"
            >
                Cadastrar Atleta
            </button>

            <button
                type="button"
                id="btnLimpar"
                (click)="limparFormulario()"
            >
                Limpar
            </button>

        </div>

    </form>

</div>
