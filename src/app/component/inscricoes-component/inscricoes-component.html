<section class="pagina">

    <h1>Inscrição</h1>

    <p>Preencha seus dados para participar da corrida.</p>

    <form (submit)="realizarInscricao()">

        <label>Nome do atleta</label>

        <input
            type="text"
            [(ngModel)]="nome"
            name="nome"
            placeholder="Informe seu nome"
            required
        >

        <label>CPF</label>

        <input
            type="text"
            [(ngModel)]="cpf"
            name="cpf"
            placeholder="Informe seu CPF"
            required
        >

        <label>Corrida</label>

        <select
            [(ngModel)]="corrida"
            name="corrida"
            required
        >
            <option value="">Selecione uma corrida</option>
            <option value="Corrida Esporte ArLivre">
                Corrida Esporte ArLivre
            </option>
            <option value="Corrida ArLivre Kids">
                Corrida ArLivre Kids
            </option>
            <option value="Desafio ArLivre">
                Desafio ArLivre
            </option>
        </select>

        <button type="submit">
            Confirmar Inscrição
        </button>

    </form>

    @if (mensagem) {
        <div class="mensagem">
            {{ mensagem }}
        </div>
    }

</section>
